name: Evals

# Runs the synthetic eval suites (evals/) against a Gemini model through the production
# gateway handler and posts the scores in the run summary. On pull requests every case runs
# 3 times and the run fails if any feature drops beyond the noise tolerance against
# evals/baseline.json (see evals/gate.js). Manual runs are report-only unless gate is ticked.
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to evaluate (blank = the pinned model)'
        required: false
      repeats:
        description: 'Runs per case'
        required: false
        default: '1'
      judge_model:
        description: 'Judge model (blank = newest stable Pro)'
        required: false
      gate:
        description: 'Fail if quality drops against evals/baseline.json'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: joesdiary-d8211
  WORKLOAD_IDENTITY_PROVIDER: projects/837714540398/locations/global/workloadIdentityPools/github/providers/joes-diary
  SERVICE_ACCOUNT: github-deploy@joesdiary-d8211.iam.gserviceaccount.com

jobs:
  evals:
    # Forks get no Google credentials, so only run for branches of this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # The key is read from Secret Manager, masked, and only exists inside these steps.
      - name: Check the judge against the hand labels
        env:
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model }}
          EVAL_CALIBRATE: '1'
          EVAL_OUT: ${{ runner.temp }}/eval-results
        run: |
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$PROJECT_ID")
          echo "::add-mask::$GEMINI_API_KEY"
          GEMINI_API_KEY="$GEMINI_API_KEY" node evals/run.js

      - name: Run the evals
        env:
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model }}
          EVAL_REPEATS: ${{ inputs.repeats || '3' }}
          EVAL_GATE: ${{ (github.event_name == 'pull_request' || inputs.gate) && '1' || '0' }}
          EVAL_OUT: ${{ runner.temp }}/eval-results
        run: |
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$PROJECT_ID")
          echo "::add-mask::$GEMINI_API_KEY"
          GEMINI_API_KEY="$GEMINI_API_KEY" node evals/run.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval-results
          retention-days: 30
