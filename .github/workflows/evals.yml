name: Evals

# Runs the synthetic eval suites (evals/) against a Gemini model through the production
# gateway handler and posts the scores in the run summary. On pull requests every case runs
# 3 times and the run fails if any feature drops beyond the noise tolerance against
# evals/baseline.json (see evals/gate.js). Manual runs are report-only unless gate is ticked.
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to evaluate (blank = the pinned model)'
        required: false
      repeats:
        description: 'Runs per case'
        required: false
        default: '1'
      judge_model:
        description: 'Judge model (blank = newest stable Pro)'
        required: false
      gate:
        description: 'Fail if quality drops against evals/baseline.json'
        type: boolean
        default: false
      bakeoff:
        description: 'Model bake-off instead: "auto" or a comma list of models (judge = pinned model unless set)'
        required: false

permissions:
  contents: read
  id-token: write

# One eval run per branch at a time (a PR run and a manual run on the same branch share the
# Gemini spend cap), newest wins.
concurrency:
  group: evals-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT_ID: joesdiary-d8211
  WORKLOAD_IDENTITY_PROVIDER: projects/837714540398/locations/global/workloadIdentityPools/github/providers/joes-diary
  SERVICE_ACCOUNT: github-deploy@joesdiary-d8211.iam.gserviceaccount.com

jobs:
  evals:
    # Forks get no Google credentials, so only run for branches of this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # The key is read from Secret Manager, masked, and only exists inside these steps.
      - name: Check the judge against the hand labels
        if: inputs.bakeoff == ''
        env:
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model }}
          EVAL_CALIBRATE: '1'
          EVAL_OUT: ${{ runner.temp }}/eval-results
        run: |
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$PROJECT_ID")
          echo "::add-mask::$GEMINI_API_KEY"
          GEMINI_API_KEY="$GEMINI_API_KEY" node evals/run.js

      # The ask agent costs far more tokens than the other features, so a PR runs it only when it
      # touches the agent, its evals or the shared Gemini client.
      - name: Pick the suites
        id: suites
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(gateway/src/(agent|gemini)\.js|gateway/index\.js|evals/(agent/|cases/ask\.js))'; then
            echo "features=" >> "$GITHUB_OUTPUT"
          else
            echo "features=extractTodos,calendarNote,chat,edit" >> "$GITHUB_OUTPUT"
            echo "Skipping the ask suite: this PR does not touch the agent."
          fi

      - name: Run the evals
        if: inputs.bakeoff == ''
        env:
          EVAL_FEATURES: ${{ steps.suites.outputs.features }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model }}
          EVAL_REPEATS: ${{ inputs.repeats || '3' }}
          # The ask agent makes several model calls per case, so PRs run each of its cases once.
          EVAL_AGENT_REPEATS: ${{ github.event_name == 'pull_request' && '1' || '' }}
          EVAL_GATE: ${{ (github.event_name == 'pull_request' || inputs.gate) && '1' || '0' }}
          EVAL_OUT: ${{ runner.temp }}/eval-results
        run: |
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$PROJECT_ID")
          echo "::add-mask::$GEMINI_API_KEY"
          GEMINI_API_KEY="$GEMINI_API_KEY" node evals/run.js

      # Same cases, same judge, one run per model, then one comparison table.
      - name: Model bake-off
        if: inputs.bakeoff != ''
        env:
          BAKEOFF: ${{ inputs.bakeoff }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model }}
          EVAL_REPEATS: ${{ inputs.repeats || '3' }}
          OUT: ${{ runner.temp }}/eval-results
        run: |
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$PROJECT_ID")
          echo "::add-mask::$GEMINI_API_KEY"
          export GEMINI_API_KEY
          PINNED_MODEL=$(sed -n 's/^GEMINI_MODEL=//p' gateway/.env.joesdiary-d8211)
          export PINNED_MODEL
          export EVAL_JUDGE_MODEL="${EVAL_JUDGE_MODEL:-$PINNED_MODEL}"
          if [ "$BAKEOFF" = auto ]; then MODELS=$(node evals/bakeoff.js candidates "$PINNED_MODEL"); else MODELS="$BAKEOFF"; fi
          echo "Models: $MODELS (judge $EVAL_JUDGE_MODEL)"
          for MODEL in ${MODELS//,/ }; do
            echo "::group::$MODEL"
            EVAL_MODEL="$MODEL" EVAL_OUT="$OUT/$MODEL" node evals/run.js || echo "::warning::$MODEL run failed"
            echo "::endgroup::"
          done
          node evals/bakeoff.js compare "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval-results
          retention-days: 30
