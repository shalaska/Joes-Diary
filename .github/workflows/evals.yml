name: Evals

# Runs the synthetic eval suites (evals/) against a Gemini model through the production
# gateway handler and posts the scores in the run summary. A pull request runs only the suites
# its change can affect (evals/pickSuites.js): those cases run 3 times and the run fails if a
# feature drops beyond the noise tolerance against evals/baseline.json (see evals/gate.js).
# Manual runs are report-only unless gate is ticked.
# Every run costs money from the Gemini spend cap. The run summary ends with what it cost,
# judge included, and a run stops and fails once it reaches its spend limit.
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to evaluate (blank = the pinned model)'
        required: false
      repeats:
        description: 'Runs per case'
        required: false
        default: '1'
      judge_model:
        description: 'Judge model (blank = newest stable Pro)'
        required: false
      gate:
        description: 'Fail if quality drops against evals/baseline.json'
        type: boolean
        default: false
      bakeoff:
        description: 'Model bake-off instead: "auto" or a comma list of models (judge = pinned model unless set)'
        required: false
      thinking:
        description: 'Thinking level for the model under test (blank = model default), e.g. low'
        required: false
      features:
        description: 'Only these suites, comma list (blank = all). E.g. extractTodos,calendarNote,chat,edit,weekReview'
        required: false
      max_cost:
        description: 'Spend limit for the run in EUR (per model in a bake-off). The run stops and fails when it gets there.'
        required: false
        default: '1.00'

permissions:
  contents: read
  id-token: write

# One eval run per branch at a time (a PR run and a manual run on the same branch share the
# Gemini spend cap), newest wins.
concurrency:
  group: evals-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT_ID: joesdiary-d8211
  # The judge stays fixed when the model under test changes, so judge scores stay comparable
  # to evals/baseline.json (which was judged by this model). Change both together.
  DEFAULT_JUDGE_MODEL: gemini-3.8-flash
  # A full pull-request run cost about 0.70 EUR in November 2026. The limit is a backstop.
  EVAL_MAX_COST_EUR: ${{ inputs.max_cost || '1.00' }}
  WORKLOAD_IDENTITY_PROVIDER: projects/837714540398/locations/global/workloadIdentityPools/github/providers/joes-diary
  SERVICE_ACCOUNT: github-deploy@joesdiary-d8211.iam.gserviceaccount.com

jobs:
  evals:
    # Forks get no Google credentials, so only run for branches of this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # What a pull request runs depends on the files it changes: see evals/pickSuites.js.
      - name: Pick the suites
        id: suites
        if: github.event_name == 'pull_request'
        run: git diff --name-only "origin/${{ github.base_ref }}...HEAD" | node evals/pickSuites.js >> "$GITHUB_OUTPUT"

      # The key is read from Secret Manager, masked, and only exists inside these steps.
      # The judge is checked on manual runs, and on pull requests that change the judge.
      - name: Check the judge against the hand labels
        if: inputs.bakeoff == '' && (github.event_name == 'workflow_dispatch' || steps.suites.outputs.calibrate == 'true')
        env:
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model || env.DEFAULT_JUDGE_MODEL }}
          EVAL_CALIBRATE: '1'
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_REGION: ${{ vars.ARIZE_REGION || 'eu-west-1a' }}
          EVAL_OUT: ${{ runner.temp }}/eval-results
        run: |
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$PROJECT_ID")
          echo "::add-mask::$GEMINI_API_KEY"
          GEMINI_API_KEY="$GEMINI_API_KEY" node evals/run.js

      - name: Run the evals
        if: inputs.bakeoff == '' && steps.suites.outputs.skip != 'true'
        env:
          EVAL_FEATURES: ${{ steps.suites.outputs.features || inputs.features }}
          EVAL_THINKING: ${{ inputs.thinking }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model || env.DEFAULT_JUDGE_MODEL }}
          EVAL_REPEATS: ${{ steps.suites.outputs.repeats || inputs.repeats || '3' }}
          # The ask agent makes several model calls per case, so PRs run each of its cases once.
          EVAL_AGENT_REPEATS: ${{ github.event_name == 'pull_request' && '1' || '' }}
          # A harness-only check (gate=false from pickSuites) is not a quality run, so it is not gated.
          EVAL_GATE: ${{ ((github.event_name == 'pull_request' && steps.suites.outputs.gate != 'false') || inputs.gate) && '1' || '0' }}
          EVAL_OUT: ${{ runner.temp }}/eval-results
          # Each case also goes to Arize as a trace (evals/tracing.js). Synthetic data only.
          # Only the steps that run evals get these; without them tracing stays off.
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_REGION: ${{ vars.ARIZE_REGION || 'eu-west-1a' }}
        run: |
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$PROJECT_ID")
          echo "::add-mask::$GEMINI_API_KEY"
          GEMINI_API_KEY="$GEMINI_API_KEY" node evals/run.js

      # Same cases, same judge, one run per model, then one comparison table.
      - name: Model bake-off
        if: inputs.bakeoff != ''
        env:
          BAKEOFF: ${{ inputs.bakeoff }}
          EVAL_FEATURES: ${{ inputs.features }}
          EVAL_THINKING: ${{ inputs.thinking }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model || env.DEFAULT_JUDGE_MODEL }}
          EVAL_REPEATS: ${{ inputs.repeats || '3' }}
          OUT: ${{ runner.temp }}/eval-results
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_REGION: ${{ vars.ARIZE_REGION || 'eu-west-1a' }}
        run: |
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project="$PROJECT_ID")
          echo "::add-mask::$GEMINI_API_KEY"
          export GEMINI_API_KEY
          PINNED_MODEL=$(sed -n 's/^GEMINI_MODEL=//p' gateway/.env.joesdiary-d8211)
          export PINNED_MODEL
          export EVAL_JUDGE_MODEL="${EVAL_JUDGE_MODEL:-$PINNED_MODEL}"
          if [ "$BAKEOFF" = auto ]; then MODELS=$(node evals/bakeoff.js candidates "$PINNED_MODEL"); else MODELS="$BAKEOFF"; fi
          echo "Models: $MODELS (judge $EVAL_JUDGE_MODEL)"
          for MODEL in ${MODELS//,/ }; do
            echo "::group::$MODEL"
            EVAL_MODEL="$MODEL" EVAL_OUT="$OUT/$MODEL" node evals/run.js || echo "::warning::$MODEL run failed"
            echo "::endgroup::"
          done
          node evals/bakeoff.js compare "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval-results
          retention-days: 30
