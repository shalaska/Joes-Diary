name: Firebase Hosting

# Pull requests get a 7-day preview URL; merges to main deploy the site, the
# Firestore rules and the LLM gateway. Auth is keyless: GitHub's OIDC token is
# exchanged for a short-lived Google token through Workload Identity Federation.
# Only this repository can use the github-deploy service account. It can manage
# Hosting, Firestore rules and the gateway function, and read the Gemini key secret.
# It has no access to Firestore data, so it cannot read the diary.
on:
  pull_request:
  push:
    branches: [main]
  # Used by the weekly model-bump job, whose PRs do not trigger pull_request runs.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: joesdiary-d8211
  WORKLOAD_IDENTITY_PROVIDER: projects/837714540398/locations/global/workloadIdentityPools/github/providers/joes-diary
  SERVICE_ACCOUNT: github-deploy@joesdiary-d8211.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # The Firestore emulator needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Firestore security rules tests (emulator)
        run: npm run test:rules

      - run: npm run build

      - name: Authenticate to Google Cloud (keyless)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! npx --yes firebase-tools@14 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --expires 7d --project "$PROJECT_ID" --json > channel.json; then
            cat channel.json
            exit 1
          fi
          url=$(node -e "const r=require('./channel.json').result; console.log(Object.values(r)[0].url)")
          echo "Preview: $url"
          echo "### Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy live
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      # firestore.rules in this repo is the source of truth for the live rules.
      - name: Deploy Firestore rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes firebase-tools@14 deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive

      # gateway/.env.joesdiary-d8211 pins the Gemini model, so a merged model bump goes live here.
      - name: Deploy LLM gateway
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm ci --prefix gateway
          npx --yes firebase-tools@14 deploy --only functions:gateway --project "$PROJECT_ID" --non-interactive
